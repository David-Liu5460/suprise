<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>玫瑰</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      .rose-letter-photo {
        width: 100%;
        height: auto;
        max-height: 100%;
        flex: 1 1 auto;
        min-height: 0;
        object-fit: contain;
        background: rgba(15, 23, 42, 0.04);
        border-radius: 12px;
        display: block;
        margin: 10px auto 0;
      }

      #gate.gate-stage-envelope .gate-envelope {
        width: min(560px, 92vw);
        aspect-ratio: 3 / 4.5;
      }

      #gate.gate-stage-envelope .gate-envelope-letter {
        left: 8%;
        right: 8%;
        top: 22%;
        bottom: 4%;
        padding: 10px 12px 12px;
        display: flex;
        flex-direction: column;
        transform: translateY(-6px);
        opacity: 1;
        overflow: hidden;
        transition: none;
      }

      #gate.gate-stage-envelope .gate-envelope-letter h2 {
        margin-bottom: 6px;
        font-size: 16px;
      }

      #gate.gate-stage-envelope .gate-envelope-flap {
        height: 38%;
        transition: none;
      }

      #gate.gate-stage-envelope .gate-envelope-seal {
        transform: translateY(-30%);
      }

      #gate.gate-stage-envelope .gate-envelope-letter {
        top: 28%;
      }

      .rose-letter-note {
        margin: 6px 0 0;
        font-size: 13px;
        line-height: 1.55;
        color: rgba(24, 24, 27, 0.72);
      }

      #rose-stage {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px 16px;
        box-sizing: border-box;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(820px 620px at 52% 42%, rgba(244, 63, 94, 0.22) 0%, rgba(244, 63, 94, 0) 60%),
          radial-gradient(880px 660px at 62% 68%, rgba(251, 146, 60, 0.14) 0%, rgba(251, 146, 60, 0) 62%),
          rgba(2, 3, 8, 0.78);
      }

      #rose-stage.rose-stage-visible {
        display: flex;
      }

      #rose-stage::before {
        content: '';
        position: absolute;
        inset: -42%;
        background: conic-gradient(
          from 120deg,
          rgba(244, 63, 94, 0.32),
          rgba(251, 146, 60, 0.24),
          rgba(244, 114, 182, 0.26),
          rgba(244, 63, 94, 0.32)
        );
        filter: blur(80px);
        opacity: 0;
        transform: translate3d(0, 0, 0) rotate(0deg);
        transition: opacity 600ms ease;
        pointer-events: none;
      }

      #rose-stage.rose-stage-visible::before {
        opacity: 0.58;
        animation: rose-aurora 14s linear infinite;
      }

      #rose-stage::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(circle at 10px 10px, rgba(255, 255, 255, 0.12) 0 1px, transparent 2px),
          radial-gradient(circle at 26px 26px, rgba(255, 255, 255, 0.08) 0 1px, transparent 3px);
        background-size: 120px 120px, 240px 240px;
        background-position: 0 0, 60px 90px;
        opacity: 0;
        mix-blend-mode: screen;
        pointer-events: none;
      }

      #rose-stage.rose-stage-visible::after {
        opacity: 0.25;
        animation: rose-twinkle 10s linear infinite;
      }

      #rose-wind {
        position: relative;
        z-index: 1;
        transform-origin: 50% 92%;
        will-change: transform;
      }

      #rose-stage.rose-stage-visible #rose-wind {
        animation: rose-wind 6.6s ease-in-out 1100ms infinite;
      }

      #rose-music-toggle {
        position: absolute;
        right: 16px;
        bottom: 16px;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 38px;
        padding: 0 14px;
        border-radius: 9999px;
        background: rgba(244, 63, 94, 0.12);
        border: 1px solid rgba(244, 63, 94, 0.28);
        color: rgba(248, 250, 252, 0.92);
        font-size: 14px;
        letter-spacing: 0.02em;
        cursor: pointer;
        user-select: none;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
      }

      #rose-music-toggle:hover {
        background: rgba(244, 63, 94, 0.18);
        transform: translateY(-1px);
        box-shadow: 0 12px 32px rgba(244, 63, 94, 0.18);
      }

      #rose-music-toggle:active {
        transform: translateY(0);
      }

      #rose-music-toggle:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px rgba(244, 63, 94, 0.35);
      }

      #c {
        position: relative;
        z-index: 1;
        width: min(92vw, 777px);
        height: auto;
        border-radius: 16px;
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.35);
        background: rgba(0, 0, 0, 0.06);
        opacity: 0;
        transform: translateY(18px) scale(0.96);
        filter: drop-shadow(0 18px 44px rgba(244, 63, 94, 0.22));
        will-change: transform, opacity, filter;
      }

      #rose-stage.rose-stage-visible #c {
        animation:
          rose-pop 720ms cubic-bezier(0.19, 1, 0.22, 1) both,
          rose-breathe 7s ease-in-out 900ms infinite;
      }

      @keyframes rose-pop {
        0% {
          opacity: 0;
          transform: translateY(18px) scale(0.96);
          filter: drop-shadow(0 16px 40px rgba(244, 63, 94, 0.16));
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: drop-shadow(0 26px 60px rgba(244, 63, 94, 0.28));
        }
      }

      @keyframes rose-breathe {
        0%,
        100% {
          transform: translateY(0) scale(1);
          filter: drop-shadow(0 26px 60px rgba(244, 63, 94, 0.28));
        }
        50% {
          transform: translateY(-2px) scale(1.012);
          filter: drop-shadow(0 34px 74px rgba(244, 63, 94, 0.36));
        }
      }

      @keyframes rose-aurora {
        0% {
          transform: translate3d(-2%, -1%, 0) rotate(0deg);
        }
        50% {
          transform: translate3d(2%, 1%, 0) rotate(180deg);
        }
        100% {
          transform: translate3d(-2%, -1%, 0) rotate(360deg);
        }
      }

      @keyframes rose-twinkle {
        0% {
          background-position: 0 0, 60px 90px;
        }
        100% {
          background-position: 180px 160px, -120px 40px;
        }
      }

      @keyframes rose-wind {
        0% {
          transform: translateX(-6px) translateY(1px) rotate(-1.2deg);
        }
        50% {
          transform: translateX(8px) translateY(-1px) rotate(1.6deg);
        }
        100% {
          transform: translateX(-6px) translateY(1px) rotate(-1.2deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #rose-stage.rose-stage-visible::before,
        #rose-stage.rose-stage-visible::after {
          animation: none;
        }

        #rose-stage.rose-stage-visible #rose-wind {
          animation: none;
          transform: none;
        }

        #rose-stage.rose-stage-visible #c {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="gate" class="gate-visible gate-stage-pass">
      <div class="gate-pass-layer" id="gate-pass-layer">
        <div class="gate-pass-inner">
          <div class="gate-pass-label">LEVEL CLEAR</div>
          <div class="gate-pass-title">情人节快乐！</div>
          <div class="gate-pass-text" id="gate-pass-text" role="status" aria-live="polite"></div>
        </div>
      </div>

      <div class="gate-envelope-layer" id="gate-envelope-layer" hidden>
        <div class="gate-envelope-hint">To 猪猪：你的情人节小惊喜</div>
        <div class="gate-envelope gate-envelope-emphasize" id="gate-envelope" role="button" tabindex="0" aria-label="打开信封">
          <div class="gate-envelope-body">
            <div class="gate-envelope-pocket"></div>
            <div class="gate-envelope-flap">
              <div class="gate-envelope-seal">开</div>
            </div>
            <div class="gate-envelope-letter">
              <h2>To 猪猪</h2>
              <img class="rose-letter-photo" src="./assets/13415607759685320.jpeg" alt="我们" loading="lazy" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="rose-stage" aria-hidden="true">
      <button id="rose-music-toggle" type="button" aria-label="关闭音乐" aria-pressed="true" hidden>音乐：开</button>
      <div id="rose-wind" aria-hidden="true">
        <canvas id="c" aria-label="玫瑰"></canvas>
      </div>
    </div>
    <audio id="bg-audio" src="./mp3/outputs_netease_259066.mp3" preload="auto" loop playsinline></audio>

    <script>
      const gate = document.getElementById('gate')
      const passLayer = document.getElementById('gate-pass-layer')
      const envelopeLayer = document.getElementById('gate-envelope-layer')
      const envelope = document.getElementById('gate-envelope')
      const typingTarget = document.getElementById('gate-pass-text')
      const stage = document.getElementById('rose-stage')
      const bgAudio = document.getElementById('bg-audio')
      const musicToggle = document.getElementById('rose-music-toggle')

      const introText =
        '猪猪，情人节快乐。\n\n' +
        '谢谢你这一年的陪伴：有你在的日子，普通也会变得很甜。\n' +
        '这一年我们一起走过很多小片段，它们拼起来，就是我最喜欢的“我们”。\n\n' +
        '希望以后也继续牵着手，过好多好多、数不清的情人节。\n' +
        '把喜欢写进日常，把浪漫留在每一个今天。\n\n' +
        '打开信封，别眨眼——小惊喜要来啦。'

      let typingIndex = 0
      let typingTimer = null
      let typingDone = false
      let enteringRose = false
      let roseStarted = false
      let musicEnabled = true
      let musicActivated = false

      function syncMusicToggle() {
        if (!musicToggle) return
        musicToggle.textContent = musicEnabled ? '音乐：开' : '音乐：关'
        musicToggle.setAttribute('aria-label', musicEnabled ? '关闭音乐' : '开启音乐')
        musicToggle.setAttribute('aria-pressed', musicEnabled ? 'true' : 'false')
      }

      function playAudioWithCatch() {
        if (!bgAudio) return
        try {
          const p = bgAudio.play()
          if (p && typeof p.catch === 'function') {
            p.catch(() => {})
          }
        } catch (e) {}
      }

      function activateMusic() {
        if (!bgAudio || musicActivated) return
        musicActivated = true

        const remoteSrc = 'https://music.163.com/song/media/outer/url?id=259066.mp3'
        const fallbackSrc = bgAudio.getAttribute('src') || bgAudio.src || ''
        let triedFallback = false

        bgAudio.muted = false
        bgAudio.loop = true
        bgAudio.volume = 0.78

        try {
          if (remoteSrc) {
            bgAudio.src = remoteSrc
            const p = bgAudio.play()
            if (p && typeof p.catch === 'function') {
              p.catch(() => {
                if (triedFallback) return
                triedFallback = true
                if (fallbackSrc) {
                  bgAudio.src = fallbackSrc
                  playAudioWithCatch()
                }
              })
            }
          } else if (fallbackSrc) {
            bgAudio.src = fallbackSrc
            playAudioWithCatch()
          }
        } catch (e) {
          if (!triedFallback && fallbackSrc) {
            triedFallback = true
            bgAudio.src = fallbackSrc
            playAudioWithCatch()
          }
        }
      }

      function startBgMusic() {
        if (!bgAudio || !musicEnabled) return
        bgAudio.muted = false
        bgAudio.loop = true
        if (!musicActivated) {
          activateMusic()
        } else {
          playAudioWithCatch()
        }
      }

      function stopBgMusic() {
        if (!bgAudio) return
        try {
          bgAudio.pause()
        } catch (e) {}
        bgAudio.muted = true
      }

      function showEnvelopeStage() {
        gate.classList.add('gate-fade-out')
        setTimeout(() => {
          gate.classList.remove('gate-fade-out')
          gate.classList.remove('gate-stage-pass')
          gate.classList.add('gate-stage-envelope')
          passLayer.hidden = true
          envelopeLayer.hidden = false
        }, 420)
      }

      function startTyping(text, baseDelay = 74) {
        typingIndex = 0
        typingDone = false
        typingTarget.textContent = ''

        function tick() {
          typingIndex += 1
          typingTarget.textContent = text.slice(0, typingIndex)
          if (typingIndex < text.length) {
            const ch = text.charAt(typingIndex)
            let delay = baseDelay
            if (ch === '\n') delay = 520
            else if ('，。！？；：,.!?;:'.includes(ch)) delay = baseDelay + 240
            else if ('、'.includes(ch)) delay = baseDelay + 180
            typingTimer = setTimeout(tick, delay)
          } else {
            typingDone = true
            typingTimer = null
            setTimeout(() => {
              showEnvelopeStage()
            }, 3200)
          }
        }

        typingTimer = setTimeout(tick, 420)
      }

      function showRose() {
        if (enteringRose) return
        enteringRose = true
        startBgMusic()
        gate.classList.add('gate-fade-out')
        setTimeout(() => {
          gate.classList.remove('gate-visible')
          gate.classList.add('gate-hidden')
          stage.classList.add('rose-stage-visible')
          stage.setAttribute('aria-hidden', 'false')
          if (musicToggle) {
            musicToggle.hidden = false
            syncMusicToggle()
          }
          if (!roseStarted) {
            roseStarted = true
            startRose()
          }
        }, 420)
      }

      passLayer.addEventListener('click', () => {
        if (typingDone) return
        typingDone = true
        if (typingTimer) {
          clearTimeout(typingTimer)
          typingTimer = null
        }
        typingTarget.textContent = introText
        showEnvelopeStage()
      })

      envelope.addEventListener('click', () => {
        showRose()
      })

      envelope.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault()
          showRose()
        }
      })

      if (musicToggle) {
        musicToggle.addEventListener('click', () => {
          musicEnabled = !musicEnabled
          if (musicEnabled) {
            startBgMusic()
          } else {
            stopBgMusic()
          }
          syncMusicToggle()
        })
      }

      startTyping(introText)

      function startRose() {
        const canvas = document.getElementById('c')
        const context = canvas.getContext('2d')

        const zBuffer = []
        const SIZE = 777
        canvas.width = SIZE
        canvas.height = SIZE
        const h = -350

        function surface(a, b, c) {
          if (c > 60) {
            return {
              x: Math.sin(a * 7) * (13 + 5 / (0.2 + Math.pow(b * 4, 4))) - Math.sin(b) * 50,
              y: b * SIZE + 50,
              z: 625 + Math.cos(a * 7) * (13 + 5 / (0.2 + Math.pow(b * 4, 4))) + b * 400,
              r: a * 1 - b / 2,
              g: a,
            }
          }
          const A = a * 2 - 1
          const B = b * 2 - 1

          if (A * A + B * B < 1) {
            if (c > 37) {
              const j = c & 1
              const n = j ? 6 : 4
              const o = 0.5 / (a + 0.01) + Math.cos(b * 125) * 3 - a * 300
              const w = b * h
              return {
                x: o * Math.cos(n) + w * Math.sin(n) + j * 610 - 390,
                y: o * Math.sin(n) - w * Math.cos(n) + 550 - j * 350,
                z: 1180 + Math.cos(B + A) * 99 - j * 300,
                r:
                  0.4 -
                  a * 0.1 +
                  Math.pow(1 - B * B, -h * 6) * 0.15 -
                  a * b * 0.4 +
                  Math.cos(a + b) / 5 +
                  Math.pow(Math.cos((o * (a + 1) + (B > 0 ? w : -w)) / 25), 30) * 0.1 * (1 - B * B),
                g: o / 1e3 + 0.7 - o * w * 3e-6,
              }
            }
            if (c > 32) {
              c = c * 1.16 - 0.15
              const o = a * 45 - 20
              const w = b * b * h
              const z = o * Math.sin(c) + w * Math.cos(c) + 620
              return {
                x: o * Math.cos(c) - w * Math.sin(c),
                y: 28 + Math.cos(B * 0.5) * 99 - b * b * b * 60 - z / 2 - h,
                z,
                r: (b * b * 0.3 + Math.pow(1 - A * A, 7) * 0.15 + 0.3) * b,
                g: b * 0.7,
              }
            }

            const o = A * (2 - b) * (80 - c * 2)
            const w =
              99 -
              Math.cos(A) * 120 -
              Math.cos(b) * (-h - c * 4.9) +
              Math.cos(Math.pow(1 - b, 7)) * 50 +
              c * 2
            const z = o * Math.sin(c) + w * Math.cos(c) + 700
            return {
              x: o * Math.cos(c) - w * Math.sin(c),
              y: B * 99 - Math.cos(Math.pow(b, 7)) * 50 - c / 3 - z / 1.35 + 450,
              z,
              r: (1 - b / 1.2) * 0.9 + a * 0.1,
              g: Math.pow(1 - b, 20) / 4 + 0.05,
            }
          }
        }

        setInterval(() => {
          for (let i = 0; i < 10000; i++) {
            const part = i % 46
            const c = part / 0.74
            const point = surface(Math.random(), Math.random(), c)
            if (!point) continue
            const z = point.z
            const x = parseInt((point.x * SIZE) / z - h)
            const y = parseInt((point.y * SIZE) / z - h)

            const zBufferIndex = y * SIZE + x
            if (typeof zBuffer[zBufferIndex] === 'undefined' || zBuffer[zBufferIndex] > z) {
              zBuffer[zBufferIndex] = z
              const r = -parseInt(point.r * h)
              const g = -parseInt(point.g * h)
              const b = -parseInt(point.r * point.r * -80)
              context.fillStyle = `rgb(${r},${g},${b})`
              context.fillRect(x, y, 1, 1)
            }
          }
        }, 0)
      }
    </script>
  </body>
</html>
